<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="notice" role="status"></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const notice = document.querySelector("#notice");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    const topics = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    function show(message, draftText, topicName) {
      notice.textContent = message;
      draft.textContent = draftText;
      topic.textContent = topicName;
      result.hidden = !draftText;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      show("", "", ""); // clear the previous draft right away
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();
        if (data.status === "ready") {
          show("", data.draft, topics[data.topic] ?? data.topic);
        } else if (data.status === "manual_review") {
          show("AI не смог подготовить ответ. Разберите заявку и ответьте клиенту вручную.", "", "");
        } else if (data.status === "invalid_input") {
          show("Введите текст заявки.", "", "");
        } else {
          throw new Error(data.status);
        }
      } catch {
        show("Не удалось обработать заявку. Попробуйте ещё раз или разберите её вручную.", "", "");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
